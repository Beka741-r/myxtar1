    <h1>Мұхтар Әуезов</h1>
    <p>Мұхтар Әуезов (1897–1961) — жазушы, драматург, ғалым, «Абай жолы» романэпопеясының авторы.</p>
    <p>Ол Семей өңірінде, Шыңғыстау баурайында дүниеге келген.</p>
    <p class="gf">Негізгі шығармалары:</p>
    <ol>
        <li>«Абай жолы»</li>
        <li>«Қараш-Қараш оқиғасы»</li>
        <li>«Көксерек»</li>
    </ol>
